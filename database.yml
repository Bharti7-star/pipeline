apiVersion: apps/v1
kind: Deployment
metadata: 
 name: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dev
  template:
    metadata:
      labels:
        app: dev
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env: 
           - name: MYSQL_ROOT_PASSWORD
             value: "linux"
           - name: MYSQL_DATABASE
             value: "student_app" 

---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
spec: 
  selector:
   app: dev
  ports:
    - port: 3306
      targetPort: 3306
  type: Cluster
